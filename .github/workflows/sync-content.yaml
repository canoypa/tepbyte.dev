name: Sync Content

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-content
  cancel-in-progress: false

# GITHUB_TOKEN の操作では後続のワークフローが起動しないため、書き込みは CONTENT_SYNC_TOKEN で行う
permissions:
  contents: read

jobs:
  unsplash:
    runs-on: ubuntu-latest
    # secret を main からの実行に限るための environment
    environment:
      name: Content Sync
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Fetch from Unsplash
        run: pnpm sync:unsplash
        env:
          UNSPLASH_ACCESS_TOKEN: ${{ secrets.UNSPLASH_ACCESS_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synced-unsplash
          path: src/content/synced/photo.json
          if-no-files-found: error
          retention-days: 1

  zenn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Fetch from Zenn
        run: pnpm sync:zenn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synced-zenn
          path: src/content/synced/article.json
          if-no-files-found: error
          retention-days: 1

  pr:
    needs: [unsplash, zenn]
    # 取得元の job が失敗しても、成功した分は PR に載せる
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: Content Sync
      deployment: false
    env:
      BRANCH: chore/sync-content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CONTENT_SYNC_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: synced-*
          merge-multiple: true
          path: src/content/synced

      # 残っている PR もブランチの削除で閉じる
      - name: Delete previous sync branch
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin --delete "$BRANCH"
          fi

      - name: Open pull request with auto-merge
        env:
          GH_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git add src/content/synced
          if git diff --cached --quiet; then
            echo "main との差分なし"
            exit 0
          fi

          git config user.name "$OWNER"
          git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m 'chore: 外部サービスのコンテンツを同期する'
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title 'chore: 外部サービスのコンテンツを同期する' \
            --body 'Sync Content ワークフローが取り直した差分です。'
          gh pr merge "$BRANCH" --auto --merge
