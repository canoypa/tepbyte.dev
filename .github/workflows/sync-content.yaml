name: Sync Content

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-content
  cancel-in-progress: false

# 書き込みは CONTENT_SYNC_TOKEN で行うので、GITHUB_TOKEN は読み取りだけでよい
permissions:
  contents: read

jobs:
  # 取得元ごとに job を分け、1 つが失敗しても残りは PR に載せる
  unsplash:
    runs-on: ubuntu-latest
    # secret を main からの実行に限るための environment
    environment:
      name: Content Sync
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Fetch from Unsplash
        run: pnpm sync:unsplash
        env:
          UNSPLASH_ACCESS_TOKEN: ${{ secrets.UNSPLASH_ACCESS_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synced-unsplash
          path: src/content/synced/photo.json
          if-no-files-found: error
          retention-days: 1

  pr:
    needs: [unsplash]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: Content Sync
      deployment: false
    env:
      BRANCH: chore/sync-content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 以降の git push を PAT で行うため
          token: ${{ secrets.CONTENT_SYNC_TOKEN }}
          fetch-depth: 0

      # 既存のブランチは main から作り直さず、main を取り込む。ruleset が force push を禁じている
      - name: Prepare sync branch
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          # runner 既定の名義はアカウントに結び付かず、ruleset の追加承認で自動マージが止まる
          git config user.name "$OWNER"
          git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git switch "$BRANCH"
            git merge --no-edit origin/main
          else
            git switch -c "$BRANCH"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: synced-*
          merge-multiple: true
          path: src/content/synced

      - name: Open pull request with auto-merge
        env:
          GH_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: |
          git add src/content/synced
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 外部サービスのコンテンツを同期する'
          fi

          open_prs=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)

          if git diff --quiet origin/main HEAD; then
            echo "main との差分なし"
            if [ "$open_prs" != 0 ]; then
              gh pr close "$BRANCH" --comment '取り直した結果が main と同じになったため閉じます。'
            fi
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git push origin --delete "$BRANCH"
            fi
            exit 0
          fi

          git push origin "$BRANCH"

          if [ "$open_prs" = 0 ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore: 外部サービスのコンテンツを同期する' \
              --body 'Sync Content ワークフローが取り直した差分です。'
          fi
          gh pr merge "$BRANCH" --auto --merge
